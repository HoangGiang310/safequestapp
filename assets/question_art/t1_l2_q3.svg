<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  
        <defs>
          <linearGradient id="bgSunset" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F97316"/>
            <stop offset="50%" stop-color="#FB923C"/>
            <stop offset="100%" stop-color="#FED7AA"/>
          </linearGradient>
        </defs>
        <rect width="600" height="360" rx="24" fill="url(#bgSunset)"/>
        <!-- Golden sun setting -->
        <circle cx="480" cy="120" r="45" fill="#FEF08A" opacity="0.9"/>
        <!-- Road with warm tint -->
        <path d="M0 240 Q300 230 600 240 L600 360 L0 360 Z" fill="#334155"/>
        <line x1="60" y1="300" x2="140" y2="300" stroke="#FDE047" stroke-width="6" stroke-linecap="round"/>
        <line x1="200" y1="300" x2="280" y2="300" stroke="#FDE047" stroke-width="6" stroke-linecap="round"/>
        <line x1="340" y1="300" x2="420" y2="300" stroke="#FDE047" stroke-width="6" stroke-linecap="round"/>
        <line x1="480" y1="300" x2="560" y2="300" stroke="#FDE047" stroke-width="6" stroke-linecap="round"/>
      
  
  
    <g class="bear-friend">
      <!-- Ears -->
      <circle cx="412" cy="192" r="16" fill="#92400E"/>
      <circle cx="412" cy="192" r="8" fill="#FDE68A"/>
      <circle cx="468" cy="192" r="16" fill="#92400E"/>
      <circle cx="468" cy="192" r="8" fill="#FDE68A"/>
      <!-- Body & Head -->
      <ellipse cx="440" cy="250" rx="34" ry="42" fill="#3B82F6"/>
      <circle cx="440" cy="215" r="34" fill="#92400E"/>
      <!-- Snout -->
      <ellipse cx="440" cy="222" rx="16" ry="12" fill="#FDE68A"/>
      <ellipse cx="440" cy="218" rx="6" ry="4" fill="#0F172A"/>
      <path d="M440 222 L440 228" stroke="#0F172A" stroke-width="2"/>
      <!-- Eyes -->
      <circle cx="426" cy="212" r="4" fill="#0F172A"/>
      <circle cx="454" cy="212" r="4" fill="#0F172A"/>
    </g>
  
  <!-- Bouncing Soccer Ball in middle -->
  <g transform="translate(290, 260)">
    <circle cx="20" cy="20" r="20" fill="white" stroke="#0F172A" stroke-width="3"/>
    <polygon points="20,10 28,16 25,26 15,26 12,16" fill="#0F172A"/>
    <line x1="20" y1="10" x2="20" y2="0" stroke="#0F172A" stroke-width="2"/>
    <line x1="28" y1="16" x2="38" y2="14" stroke="#0F172A" stroke-width="2"/>
  </g>
  
    <g class="penguin-character">
      
      <ellipse cx="137.5" cy="277.5" rx="18.75" ry="10" fill="#F97316"/>
      <ellipse cx="182.5" cy="277.5" rx="18.75" ry="10" fill="#F97316"/>
      <ellipse cx="160" cy="220" rx="47.5" ry="60" fill="#1E293B"/>
      
      <path d="M120 207.5 Q91.25 220 107.5 238.75 Q125 226.25 120 207.5 Z" fill="#1E293B"/>
      <path d="M202.5 207.5 Q241.25 201.25 235 182.5 Q212.5 201.25 202.5 207.5 Z" fill="#1E293B"/>
      <circle cx="235" cy="180" r="12.5" fill="#F97316"/>
    
      <ellipse cx="160" cy="227.5" rx="33.75" ry="45" fill="#FFFFFF"/>
      <circle cx="130" cy="185" r="8.75" fill="#FDA4AF" opacity="0.8"/>
      <circle cx="190" cy="185" r="8.75" fill="#FDA4AF" opacity="0.8"/>
      
      <circle cx="140" cy="172.5" r="13.75" fill="white"/>
      <circle cx="180" cy="172.5" r="13.75" fill="white"/>
      <circle cx="140" cy="172.5" r="6.875" fill="#0F172A"/>
      <circle cx="180" cy="172.5" r="6.875" fill="#0F172A"/>
      <circle cx="136.25" cy="168.75" r="3.125" fill="white"/>
      <circle cx="176.25" cy="168.75" r="3.125" fill="white"/>
    
      <path d="M148.75 180 Q160 193.75 171.25 180 Q160 187.5 Z" fill="#EA580C"/>
      <polygon points="150,181.25 170,181.25 160,193.75" fill="#F97316"/>
      
    </g>
  
  <!-- Stop Badge -->
  <g transform="translate(200, 60)">
    <rect x="0" y="0" width="160" height="42" rx="12" fill="#EF4444" stroke="white" stroke-width="3"/>
    <text x="80" y="27" text-anchor="middle" font-size="16" font-family="Arial" fill="white" font-weight="bold">DỪNG LẠI!</text>
  </g>

</svg>