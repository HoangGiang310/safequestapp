<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  
        <defs>
          <linearGradient id="bgCity" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="60%" stop-color="#7DD3FC"/>
            <stop offset="100%" stop-color="#E0F2FE"/>
          </linearGradient>
        </defs>
        <rect width="600" height="360" rx="24" fill="url(#bgCity)"/>
        <!-- City Skyline silhouettes -->
        <rect x="50" y="110" width="60" height="130" fill="#BAE6FD" opacity="0.8"/>
        <rect x="130" y="80" width="70" height="160" fill="#93C5FD" opacity="0.8"/>
        <rect x="220" y="120" width="55" height="120" fill="#BAE6FD" opacity="0.8"/>
        <rect x="380" y="90" width="65" height="150" fill="#93C5FD" opacity="0.8"/>
        <rect x="460" y="115" width="80" height="125" fill="#BAE6FD" opacity="0.8"/>
        <!-- Wide City Highway -->
        <path d="M0 240 L600 240 L600 360 L0 360 Z" fill="#334155"/>
        <line x1="50" y1="300" x2="130" y2="300" stroke="#FDE047" stroke-width="5" stroke-linecap="round"/>
        <line x1="190" y1="300" x2="270" y2="300" stroke="#FDE047" stroke-width="5" stroke-linecap="round"/>
        <line x1="330" y1="300" x2="410" y2="300" stroke="#FDE047" stroke-width="5" stroke-linecap="round"/>
