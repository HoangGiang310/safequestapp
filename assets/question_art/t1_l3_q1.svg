    <rect x="140" y="40" width="160" height="180" rx="20" fill="#475569"/>
    <rect x="170" y="10" width="100" height="40" rx="12" fill="#334155"/>
  </g>
  
    <g class="penguin-character">
      
      <ellipse cx="277.5" cy="227.5" rx="18.75" ry="10" fill="#F97316"/>
      <ellipse cx="322.5" cy="227.5" rx="18.75" ry="10" fill="#F97316"/>
      <ellipse cx="300" cy="170" rx="47.5" ry="60" fill="#1E293B"/>
      
      <path d="M257.5 157.5 Q225 126.25 240 120 Z" fill="#1E293B"/>
