  <!-- Diagonal Seatbelt across Mascot -->
  <line x1="220" y1="90" x2="370" y2="240" stroke="#F59E0B" stroke-width="14" stroke-linecap="round"/>
  <circle cx="360" cy="230" r="12" fill="#DC2626"/>

